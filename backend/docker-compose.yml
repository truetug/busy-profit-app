name: busy-profit-app-backend

services:
  api:
    image: ghcr.io/truetug/busy-profit-app-backend:latest
    container_name: busy-profit-app-api
    profiles: [api]
    command: [uvicorn, busy_profit.api_runtime:build_app, --factory, --host, "0.0.0.0", --port, "8080", --no-access-log]
    restart: unless-stopped
    env_file: [../.env.api]
    ports: ["127.0.0.1:18991:8080"]
    volumes: ["../data:/data"]
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 384m
    networks: [default, edge]

  backend:
    image: ghcr.io/truetug/busy-profit-app-backend:latest
    container_name: busy-profit-app-backend
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      SHOPIFY_STATS_HISTORY_PATH: /data/history.csv
      SHOPIFY_STATS_PUBLISH_PATH: /data/public/history.csv
      SHOPIFY_STATS_POLLING_INTERVAL_SECONDS: "60"
    volumes:
      - ../data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  analytics:
    image: ghcr.io/truetug/busy-profit-app-backend:latest
    container_name: busy-profit-app-analytics
    command: ["python", "-m", "busy_profit.analytics_worker"]
    restart: unless-stopped
    environment:
      BUSY_USAGE_DATABASE_PATH: /data/usage.sqlite3
      BUSY_USAGE_LOG_DIRECTORY: /logs
      BUSY_USAGE_INTERVAL_SECONDS: "3600"
      BUSY_USAGE_RETENTION_DAYS: "90"
    volumes:
      - ../data:/data
      - /srv/edge/logs:/logs:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

networks:
  edge:
    external: true
